version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: accountabuild-postgres
    environment:
      POSTGRES_DB: accountabuild
      POSTGRES_USER: accountabuild_user
      POSTGRES_PASSWORD: accountabuild_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: 